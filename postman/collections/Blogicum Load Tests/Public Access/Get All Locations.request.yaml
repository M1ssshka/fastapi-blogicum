$kind: http-request
url: "{{baseUrl}}/locations"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response time < 500ms", function () { pm.expect(pm.response.responseTime).to.be.below(500); });
    language: text/javascript
order: 3000
