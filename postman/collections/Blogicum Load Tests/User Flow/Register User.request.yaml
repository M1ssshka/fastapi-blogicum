$kind: http-request
url: "{{baseUrl}}/register"
method: POST
body:
  type: json
  content: |-
    {
        "username": "{{temp_username}}",
        "password": "Password123!",
        "email": "{{temp_email}}",
        "first_name": "Test",
        "last_name": "User"
    }
scripts:
  - type: beforeRequest
    code: |-
      const randomSuffix = Math.floor(Math.random() * 10000);
      pm.collectionVariables.set("temp_username", "user_" + randomSuffix);
      pm.collectionVariables.set("temp_email", "user_" + randomSuffix + "@example.com");
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status is 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
